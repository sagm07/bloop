spec_version: "0.1.0"
name: bloop
version: 1.0.0
description: "ML failure auditor. Finds what 87% accuracy hides."
model:
  preferred: groq:llama-3.3-70b-versatile
runtime:
  timeout: 60000
  entrypoint: server.mjs
  port: 3000
deploy:
  provider: clawless
  env:
    - GROQ_API_KEY
skills:
  - segment-analysis
  - root-cause
  - fix-generator
  - audit-model
  - write-report
tools:
  - csv-parser        # implemented: metrics.mjs
  - report-exporter   # planned: v0.4
  - drift-detector    # planned: v0.5
  - bias-auditor      # planned: v0.5
tags:
  - ml
  - bias-detection
  - hackathon
  - gitagent