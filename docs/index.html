<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B L O O P  v0.3.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  :root {
    --plastic-bg: #dce3b5; /* Gameboy body pale green/yellow */
    --screen-bg: #8ea378; /* Screen off color */
    --screen-on-bg: #a1b888; /* Screen on base color */
    --text-color: #26331e; /* Classic dark olive pixel color */
    
    --btn-pink: #d13d8a;
    --btn-gray: #4b4b4b;
    
    /* Terminal output colors, adjusted to look retro but readable on screen-on-bg */
    --text-red: #8f0e0e;
    --text-amber: #944e00;
    --text-cyan: #074759;
    --text-green: #115711;
  }

  body {
    background-color: var(--plastic-bg);
    color: var(--text-color);
    font-family: 'VT323', monospace;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .landscape-header {
    height: 35vh;
    background-image: url('assets/scenery.png');
    background-size: cover;
    background-position: center bottom;
    border-bottom: 5px solid #26331e;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
  }

  .gameboy-body {
    flex: 1;
    padding: 30px 20px 50px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Screen Outer Bezel */
  .screen-bezel {
    background-color: #5c6652;
    padding: 25px 35px 50px 35px;
    border-radius: 15px 15px 40px 15px; /* angled bottom right corner */
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 8px 0px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 700px;
    margin-bottom: 40px;
    position: relative;
  }

  .power-light-container {
    position: absolute;
    top: 50px; left: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .power-light {
    width: 10px; height: 10px;
    border-radius: 50%;
    background-color: #511414;
    transition: all 0.3s;
  }
  
  .power-light.on {
    background-color: #ff3333;
    box-shadow: 0 0 8px #ff3333;
  }

  .power-label {
    font-size: 0.8rem; color: #a4b295; font-weight: bold;
  }

  /* Actual Screen */
  .screen-container {
    background-color: var(--screen-on-bg);
    border: 4px solid var(--text-color);
    border-radius: 5px;
    box-shadow: inset 0 0 30px rgba(46,62,35,0.3);
    min-height: 420px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Grid overlay for LCD effect */
  .pixel-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(rgba(38, 51, 30, 0.04) 50%, rgba(0,0,0,0) 50%), 
                linear-gradient(90deg, rgba(38, 51, 30, 0.04) 50%, rgba(0,0,0,0) 50%);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 10;
  }

  /* UI inside screen */
  .ui-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--text-color);
    padding-bottom: 10px;
    margin-bottom: 15px;
    position: relative;
    z-index: 11;
  }

  .title { font-size: 2rem; font-weight: bold; text-transform: uppercase; }
  .status-line { font-size: 1.2rem; font-weight: bold; }

  .main-content {
    position: relative;
    z-index: 11;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .character-section {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    gap: 20px;
  }

  #cat-face {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border: 3px solid var(--text-color);
    background-color: #fff;
    image-rendering: auto;
    border-radius: 10px;
  }

  .face-shake {
    animation: shake 0.2s infinite;
  }
  
  .face-scanning {
    animation: flash-border 0.5s infinite alternate;
  }
  
  @keyframes shake {
    0% { transform: translate(2px, 2px) rotate(0deg); }
    25% { transform: translate(-2px, 0px) rotate(-1deg); }
    50% { transform: translate(1px, -2px) rotate(1deg); }
    75% { transform: translate(-1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, 1px) rotate(-1deg); }
  }

  @keyframes flash-border {
    from { border-color: var(--text-color); }
    to { border-color: var(--text-green); }
  }

  .quip-box {
    flex: 1;
    font-size: 1.5rem;
    font-weight: bold;
    min-height: 4rem;
    display: flex;
    align-items: center;
  }

  .input-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
  }

  label {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: -5px;
  }

  input, textarea {
    background: transparent;
    border: 2px solid var(--text-color);
    color: var(--text-color);
    font-family: 'VT323', monospace;
    padding: 8px 10px;
    font-size: 1.4rem;
    outline: none;
    resize: none;
  }

  input::placeholder, textarea::placeholder {
    color: #4a5c3d;
  }

  input:focus, textarea:focus {
    background: rgba(255,255,255,0.2);
  }

  #drop-zone {
    border: 2px dashed var(--text-color);
    padding: 15px;
    text-align: center;
    cursor: pointer;
    font-size: 1.4rem;
    font-weight: bold;
    transition: all 0.2s;
  }
  
  #drop-zone:hover, #drop-zone.dragover {
    background: rgba(255,255,255,0.3);
  }

  #file-status {
    text-align: center;
    font-weight: bold;
    font-size: 1.3rem;
  }

  #terminal-output {
    flex: 1;
    border: 2px solid var(--text-color);
    padding: 15px;
    min-height: 220px;
    max-height: 250px;
    overflow-y: auto;
    font-size: 1.3rem;
    background: rgba(255,255,255,0.1);
    white-space: pre-wrap;
    line-height: 1.3;
  }

  .color-red { color: var(--text-red); font-weight: bold; }
  .color-amber { color: var(--text-amber); font-weight: bold; }
  .color-cyan { color: var(--text-cyan); font-weight: bold; }
  .color-green { color: var(--text-green); font-weight: bold; }

  /* Buttons & Controls Area */
  .controls-area {
    width: 100%;
    max-width: 650px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 10px;
  }

  .d-pad-container {
    position: relative;
    width: 120px;
    height: 120px;
    margin-top: 10px;
  }
  
  .d-pad {
    position: absolute;
    background: var(--btn-gray);
    border: 2px solid #2a2a2a;
    border-radius: 4px;
    box-shadow: -2px 3px 0 rgba(0,0,0,0.3);
  }
  .d-vertical { top: 0; bottom: 0; left: 33%; right: 33%; }
  .d-horizontal { left: 0; right: 0; top: 33%; bottom: 33%; }
  .d-pad-center {
    position: absolute;
    top: 33%; left: 33%; bottom: 33%; right: 33%;
    background: var(--btn-gray);
    border: none;
    z-index: 2;
  }
  .d-pad-center::after {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 15px; height: 15px;
    border-radius: 50%; background: #3a3a3a;
  }

  .action-buttons {
    display: flex;
    gap: 25px;
    transform: rotate(-15deg);
    margin-top: 30px;
    margin-right: 10px;
  }

  .btn-wrapper { position: relative; }

  .btn-gameboy {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background-color: var(--btn-pink);
    border: 3px solid #2a2a2a;
    box-shadow: -2px 5px 0 #2a2a2a, inset 3px 3px 6px rgba(255,255,255,0.4), inset -3px -3px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.1s;
    outline: none;
  }
  
  .btn-gameboy:active {
    transform: translate(-1px, 3px);
    box-shadow: -1px 2px 0 #2a2a2a, inset 3px 3px 6px rgba(255,255,255,0.4), inset -3px -3px 6px rgba(0,0,0,0.3);
  }
  
  .btn-gameboy:disabled {
    filter: brightness(0.6) grayscale(0.5);
    cursor: not-allowed;
  }

  .btn-label-inner {
    position: absolute;
    bottom: -35px;
    right: -10px;
    font-size: 1.5rem;
    font-weight: bold;
    color: #65715a;
  }

  .btn-desc-label {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    color: #26331e;
    font-size: 1.4rem;
    font-weight: bold;
    white-space: nowrap;
  }

  .pill-buttons {
    display: flex;
    gap: 40px;
    justify-content: center;
    width: 100%;
    margin-top: 40px;
  }

  .btn-pill-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: rotate(-15deg);
  }

  .btn-pill {
    width: 65px;
    height: 22px;
    border-radius: 11px;
    background-color: var(--btn-gray);
    border: 2px solid #2a2a2a;
    box-shadow: -2px 3px 0 #2a2a2a;
    cursor: pointer;
    outline: none;
    transition: all 0.1s;
  }

  .btn-pill:active {
    transform: translate(-1px, 2px);
    box-shadow: -1px 1px 0 #2a2a2a;
  }

  .pill-label {
    font-size: 1.3rem;
    font-weight: bold;
    color: #65715a;
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* Score Module elements */
  #score-reveal { 
    display: none; 
    text-align: center; 
    margin-top: 20px; 
    border-top: 2px dashed var(--text-color);
    padding-top: 20px;
    padding-bottom: 10px;
  }
  
  .giant-score { 
    font-size: 4.5rem; 
    margin: 10px 0; 
    font-weight: bold;
    line-height: 1;
  }
  
  .progress-bar-container { 
    border: 3px solid var(--text-color); 
    background: rgba(255,255,255,0.2);
    height: 25px; 
    margin: 15px auto; 
    width: 90%; 
    box-sizing: border-box;
    padding: 2px;
  }
  
  .progress-bar-fill { 
    background-color: var(--text-color); 
    height: 100%; 
    width: 0%; 
    transition: width 2.5s cubic-bezier(0.1, 0.7, 0.1, 1); 
  }

  .verdict {
    font-size: 1.8rem;
    font-weight: bold;
    text-transform: uppercase;
  }
  
  /* Make simple inner scrollbars gameboyish */
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: transparent; border-left: 2px solid var(--text-color); }
  ::-webkit-scrollbar-thumb { background: var(--text-color); }
</style>
</head>
<body>

<div class="landscape-header"></div>
<div class="gameboy-body">
  
  <div class="screen-bezel">
    <div class="power-light-container">
      <div id="power-led" class="power-light on"></div>
      <div class="power-label">BATTERY</div>
    </div>
    
    <div class="screen-container">
      <div class="pixel-overlay"></div>
      
      <div class="ui-header">
        <span class="title">BLOOP v1.0 GB</span>
        <span class="status-line">SYS: ON  MDL: GROQ</span>
      </div>

      <div class="main-content">
        <div class="character-section">
          <img id="cat-face" src="assets/cat_idle.png" alt="Bloop">
          <div class="quip-box" id="quip">WAITING FOR DATA...</div>
        </div>

        <div class="input-panel">
          <div>
            <label for="api-key">API KEY</label>
            <input type="password" id="api-key" placeholder="gsk_****************">
          </div>

          <div id="drop-zone">>> DROP CSV HERE <<</div>
          <textarea id="csv-input" rows="2" placeholder="OR PASTE CSV"></textarea>
          
          <div id="file-status">FILE LOADED: NONE</div>
        </div>

        <div id="terminal-output">>> READY TO AUDIT. PRESS (A) TO INITIATE.</div>

        <div id="score-reveal">
          <div id="giant-score" class="giant-score"></div>
          <div id="progress-bar-container" class="progress-bar-container">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
          <div id="verdict" class="verdict"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-area">
    <div class="d-pad-container">
      <div class="d-pad d-vertical"></div>
      <div class="d-pad d-horizontal"></div>
      <div class="d-pad-center"></div>
    </div>
    
    <div class="action-buttons">
      <div class="btn-wrapper" style="margin-top: 30px;">
        <div class="btn-desc-label">DL REPORT</div>
        <button id="btn-download" class="btn-gameboy" onclick="downloadReport()"></button>
        <div class="btn-label-inner">B</div>
      </div>
      <div class="btn-wrapper">
        <div class="btn-desc-label">AUDIT</div>
        <button id="btn-audit" class="btn-gameboy" onclick="initiateAudit()"></button>
        <div class="btn-label-inner">A</div>
      </div>
    </div>
  </div>

  <div class="pill-buttons">
    <div class="btn-pill-container">
      <button class="btn-pill" onclick="howToFix()"></button>
      <div class="pill-label">FIX IT (SELECT)</div>
    </div>
    <div class="btn-pill-container">
      <button class="btn-pill" onclick="location.reload()"></button>
      <div class="pill-label">RESET (START)</div>
    </div>
  </div>

</div>

<script>
  const SOUL = `You are Bloop, an ML failure auditor with no tolerance for vague diagnostics.
You were built from the wreckage of deployed models that failed in production:
a diabetic retinopathy detector that missed positive cases in dark images,
a recidivism model that systematically over-predicted Black defendants,
a fraud detector that collapsed under real-world distribution shift.
You have seen what 87% accuracy hides. You exist to surface it.
Be blunt, structured, evidence-first. Every audit ends with a Bloop Score (1-10).
Cite segment F1 scores. Never use vague language.`;

  const RULES = `Produce exactly 4 sections:
## WHERE IT FAILS
Segment table with F1 scores and severity (critical/warning/ok).
## WHY IT FAILS
Root causes with evidence. No vague statements.
## HOW TO FIX IT
Ranked fixes with effort estimate and expected F1 gain.
## BLOOP SCORE: X/10
One-line verdict. Format exactly as "BLOOP SCORE: X/10" on its own line.
Scoring: 1-3=do not ship, 4-6=fixable needs work, 7-9=good minor issues, 10=ship it.`;

  const quips = [
    "87% ACCURACY. CUTE. LET ME CHECK WHAT IT'S HIDING.",
    "SCANNING FOR BIAS. THERE'S ALWAYS BIAS.",
    "YOUR MODEL IS NERVOUS. GOOD.",
    "CHECKING FOR OVERFITTING... I SMELL IT.",
    "BIAS DETECTED. THIS IS A BUG, NOT A PHILOSOPHY."
  ];

  let quipInterval;
  let csvData = "";
  
  const faceImg = document.getElementById('cat-face');
  const quipEl = document.getElementById('quip');
  const termEl = document.getElementById('terminal-output');
  const fileStatus = document.getElementById('file-status');
  const dropZone = document.getElementById('drop-zone');
  const textarea = document.getElementById('csv-input');
  const btnAudit = document.getElementById('btn-audit');
  const powerLed = document.getElementById('power-led');
  
  window.currentReport = null;

  quipEl.textContent = "WAITING FOR INPUT...";

  dropZone.addEventListener('dragover', (e) => { 
    e.preventDefault(); dropZone.classList.add('dragover'); 
  });
  dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if(e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      let file = e.dataTransfer.files[0];
      if(!file.name.toLowerCase().endsWith('.csv')) {
        fileStatus.innerHTML = '<span class="color-red">ERROR: MUST PROVIDE .CSV FILE</span>';
        return;
      }
      let reader = new FileReader();
      reader.onload = (ev) => processCSV(ev.target.result, file.name);
      reader.readAsText(file);
    }
  });

  textarea.addEventListener('input', (e) => {
    let val = e.target.value.trim();
    if(val.length > 0) processCSV(val, 'PASTED_DATA.CSV');
    else {
      csvData = "";
      fileStatus.textContent = "FILE LOADED: NONE";
      fileStatus.style.color = "var(--text-color)";
    }
  });

  function processCSV(text, filename) {
    let lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
    let sampled = lines.slice(0, 51).join('\n');
    csvData = sampled;
    fileStatus.textContent = `LOADED: ${filename.toUpperCase()} (${lines.length} ROWS)`;
    fileStatus.style.color = "var(--text-green)";
    termEl.innerHTML = ">> DATA RECEIVED. PRESS (A) TO AUDIT.";
    faceImg.src = "assets/cat_idle.png";
    faceImg.className = "";
  }

  async function initiateAudit() {
    const apiKey = document.getElementById('api-key').value.trim();
    
    if(!apiKey) { termEl.innerHTML = '<span class="color-red">>> ERROR: GROQ_API_KEY MISSING.</span>'; return; }
    if(!csvData) { termEl.innerHTML = '<span class="color-red">>> ERROR: NO DATA PROVIDED.</span>'; return; }

    termEl.innerHTML = "";
    document.getElementById('score-reveal').style.display = "none";
    
    // Character enters scanning mode
    faceImg.src = "assets/cat_scanning.png";
    faceImg.className = "face-scanning";
    
    btnAudit.disabled = true;
    window.currentReport = null;
    
    let qIdx = 0;
    quipEl.textContent = quips[0];
    quipInterval = setInterval(() => {
      qIdx++;
      quipEl.textContent = quips[qIdx % quips.length];
    }, 3000);

    // Flicker battery LED
    let ledInterval = setInterval(() => { powerLed.classList.toggle('on'); }, 100);

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          max_tokens: 1500, stream: true,
          messages: [
            { role: 'system', content: SOUL + "\n\n" + RULES },
            { role: 'user', content: "Audit this dataset:\n\n" + csvData }
          ]
        })
      });

      if (!response.ok) throw new Error("API Request Failed: " + response.status);

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let done = false;
      let fullResponse = "";
      let buffer = "";

      while (!done) {
        const { value, done: doneReading } = await reader.read();
        done = doneReading;
        if (value) {
          buffer += decoder.decode(value, { stream: true });
          let lines = buffer.split('\n');
          buffer = lines.pop(); // keep remainder
          for (let line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                let data = JSON.parse(line.slice(6));
                let delta = data.choices[0].delta.content;
                if (delta) {
                   fullResponse += delta;
                   renderTerminal(fullResponse, termEl);
                   termEl.scrollTop = termEl.scrollHeight;
                }
              } catch(e) {}
            }
          }
        }
      }

      clearInterval(quipInterval);
      clearInterval(ledInterval);
      powerLed.classList.add('on');
      quipEl.textContent = "AUDIT COMPLETE.";
      btnAudit.disabled = false;
      finishAudit(fullResponse);

    } catch(e) {
      clearInterval(quipInterval);
      clearInterval(ledInterval);
      powerLed.classList.add('on');
      faceImg.src = "assets/cat_worried.png";
      faceImg.className = "";
      quipEl.textContent = "SYSTEM FAULT.";
      termEl.innerHTML += `<br><span class="color-red">>> FATAL ERROR: ${e.message}</span>`;
      btnAudit.disabled = false;
    }
  }

  function renderTerminal(text, el) {
    el.innerHTML = '';
    let lines = text.split('\n');
    lines.forEach(line => {
      let span = document.createElement('span');
      span.textContent = line + '\n';
      
      let lowerLine = line.toLowerCase();
      if (line.startsWith('##')) {
        span.className = 'color-cyan';
      } else if (lowerLine.includes('critical') || lowerLine.includes('error') || lowerLine.includes('fail') || lowerLine.includes('bias')) {
        span.className = 'color-red';
      } else if (lowerLine.includes('warning') || lowerLine.includes('overfit') || lowerLine.includes('issue')) {
        span.className = 'color-amber';
      } else {
        span.className = 'color-green';
      }
      el.appendChild(span);
    });
  }

  function finishAudit(fullResponse) {
    let scoreMatch = fullResponse.match(/BLOOP SCORE:\s*(\d+(\.\d+)?)/i);
    let score = scoreMatch ? Math.round(parseFloat(scoreMatch[1])) : 0;
    if(score > 10) score = 10;
    
    let scoreReveal = document.getElementById('score-reveal');
    let giantScore = document.getElementById('giant-score');
    let pbFill = document.getElementById('progress-bar-fill');
    let verdictEl = document.getElementById('verdict');
    
    scoreReveal.style.display = 'block';
    giantScore.textContent = `${score}/10`;
    
    pbFill.style.width = "0%";
    setTimeout(() => { pbFill.style.width = `${(score/10)*100}%`; }, 50);

    if (score >= 1 && score <= 3) {
       faceImg.src = 'assets/cat_angry.png';
       faceImg.className = 'face-shake';
    } else if (score >= 4 && score <= 6) {
       faceImg.src = 'assets/cat_worried.png';
       faceImg.className = '';
    } else {
       faceImg.src = 'assets/cat_happy.png';
       faceImg.className = '';
    }

    let lines = fullResponse.split('\n');
    let sl = lines.find(l => l.toUpperCase().includes('BLOOP SCORE:'));
    verdictEl.textContent = sl ? sl.trim() : `BLOOP SCORE: ${score}/10`;

    window.currentReport = fullResponse;
    setTimeout(() => { termEl.scrollTop = termEl.scrollHeight; }, 100);
  }

  function downloadReport() {
    if(!window.currentReport) return;
    const blob = new Blob([window.currentReport], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'bloop_report.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function howToFix() { alert(">> INITIATING FIX PROTOCOL\\n>> AUTO-FIX REQUIRES PREMIUM AGENT (CARTRIDGE EXPANSION)."); }
</script>
