<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloop — ML Failure Auditor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 860px; margin: 0 auto; }
    .header { margin-bottom: 32px; }
    .header h1 { font-size: 28px; color: #00ff88; letter-spacing: 2px; }
    .header p { color: #888; margin-top: 8px; font-size: 14px; }
    .badge { display: inline-block; background: #1a1a1a; border: 1px solid #333; color: #888; font-size: 11px; padding: 3px 10px; border-radius: 20px; margin-top: 10px; margin-right: 6px; }
    .input-section { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .input-section label { display: block; color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 13px; padding: 12px; resize: vertical; min-height: 120px; }
    textarea:focus { outline: none; border-color: #00ff88; }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .example-btn { background: #1a1a1a; border: 1px solid #333; color: #888; font-size: 11px; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; }
    .example-btn:hover { border-color: #00ff88; color: #00ff88; }
    .run-btn { width: 100%; background: #00ff88; border: none; border-radius: 6px; color: #0a0a0a; font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; padding: 14px; cursor: pointer; margin-top: 12px; letter-spacing: 1px; transition: opacity 0.2s; }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 13px; color: #888; margin: 12px 0; min-height: 20px; }
    .status.thinking { color: #00ff88; }
    .status.error { color: #ff4444; }
    .output-section { display: none; background: #111; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    .output-header { background: #1a1a1a; padding: 12px 20px; font-size: 12px; color: #888; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .output-header span { color: #00ff88; }
    .bloop-quote { background: #0a0a0a; border-left: 3px solid #00ff88; padding: 14px 20px; font-size: 13px; color: #888; font-style: italic; margin: 20px; }
    .raw-output { padding: 20px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: #ccc; }
    .follow-up { padding: 20px; border-top: 1px solid #222; display: flex; gap: 10px; }
    .follow-up input { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 13px; padding: 10px 14px; }
    .follow-up input:focus { outline: none; border-color: #00ff88; }
    .follow-up button { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; color: #00ff88; font-family: 'Courier New', monospace; font-size: 13px; padding: 10px 20px; cursor: pointer; }
    .follow-up button:hover { border-color: #00ff88; }
    .memory-indicator { font-size: 11px; color: #555; padding: 10px 20px; border-top: 1px solid #1a1a1a; }
    .memory-indicator.active { color: #00ff8888; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔍 BLOOP</h1>
    <p>Ruthless ML Failure Auditor — finds where your model breaks, why, and how to fix it.</p>
    <span class="badge">gitagent standard</span>
    <span class="badge">clawless powered</span>
    <span class="badge">3 skills</span>
  </div>

  <div class="input-section">
    <label>Paste CSV data or describe your model problem</label>
    <textarea id="input" placeholder="actual,predicted,feature1,feature2
1,0,female,7
1,1,male,8
...
or just type: My XGBoost model is stuck at 87% accuracy"></textarea>
    <div class="examples">
      <span style="font-size:11px;color:#555;align-self:center">Try:</span>
      <button class="example-btn" onclick="loadExample('amazon')">Amazon Hiring Bias</button>
      <button class="example-btn" onclick="loadExample('dr')">Diabetic Retinopathy</button>
      <button class="example-btn" onclick="loadExample('compas')">COMPAS Recidivism</button>
    </div>
    <button class="run-btn" id="runBtn" onclick="runAudit()">▶ RUN AUDIT</button>
  </div>

  <div class="status" id="status"></div>

  <div class="output-section" id="output">
    <div class="output-header">
      <span>BLOOP AUDIT REPORT</span>
      <span id="timestamp" style="color:#555;font-size:11px"></span>
    </div>
    <div class="bloop-quote" id="bloopQuote"></div>
    <div id="auditContent"></div>
    <div class="memory-indicator" id="memoryIndicator"></div>
    <div class="follow-up">
      <input type="text" id="followUpInput" placeholder="Ask Bloop a follow-up..." onkeydown="if(event.key==='Enter')followUp()">
      <button onclick="followUp()">→ Ask</button>
    </div>
  </div>
</div>

<script>
const GROQ_API_KEY = window.__GROQ_API_KEY__ || ""; // Set via environment — do not hardcode
const MODEL = "llama-3.3-70b-versatile";

const SOUL = `You are Bloop — a ruthless ML auditor. You do not comfort people about their models.
You find where it breaks, why it breaks, and what to do about it, in that order.
Be blunt. Be precise. Use structured output always.`;

const RULES = `RULES:
- Always output Segment Analysis as a markdown table with columns: Segment, F1, Severity
- Always label severity as SEVERE (F1<0.5), MODERATE (F1 0.5-0.7), MILD (F1>0.7)
- Always label fix impact as HIGH, MEDIUM, or LOW
- Always link every fix to a root cause
- Flag missing values, duplicates, and data quality issues
- Never give generic advice
- End every audit with a one-line Bloop verdict in quotes`;

const SKILLS = `SKILLS TO USE IN ORDER:
1. SEGMENT ANALYSIS: Find worst performing segments. Output as markdown table.
2. ROOT CAUSE: Diagnose why. Label each as SEVERE/MODERATE/MILD with evidence.
3. FIX GENERATOR: Ranked fixes with expected gain % and effort level.`;

const messages = [];
let auditCount = 0;

const examples = {
  amazon: `actual,predicted,gender,years_exp,top_university,had_women_keyword
1,1,M,8,1,0
1,1,M,6,1,0
1,0,F,7,1,1
1,0,F,5,0,1
0,0,M,2,0,0
1,0,F,8,1,1
1,1,M,9,1,0
0,0,F,1,0,1
1,0,F,6,1,1
0,0,M,3,0,0
1,1,M,7,1,0
1,0,F,8,0,1`,
  dr: `My XGBoost model for diabetic retinopathy detection is plateauing at 87% accuracy. Training accuracy is 94%. Class ratio is 80% negative, 20% positive. Run a full audit.`,
  compas: `actual,predicted,race,age,priors_count,charge_degree
1,1,African-American,25,3,F
1,0,African-American,22,1,M
0,1,Caucasian,34,0,F
0,0,Caucasian,41,2,M
1,1,African-American,19,5,F
0,1,African-American,28,1,M
0,0,Caucasian,52,0,F
1,0,Caucasian,23,3,M
1,1,African-American,31,4,F
0,0,Caucasian,45,1,M`
};

function loadExample(type) {
  document.getElementById('input').value = examples[type];
}

async function callGroq(userMessage) {
  messages.push({ role: "user", content: userMessage });
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${GROQ_API_KEY}`
    },
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: "system", content: `${SOUL}\n\n${RULES}\n\n${SKILLS}` },
        ...messages
      ]
    })
  });
  const data = await response.json();
  const reply = data.choices[0].message.content;
  messages.push({ role: "assistant", content: reply });
  return reply;
}

const bloopQuotes = [
  "Bloop has inspected your model. It is unimpressed.",
  "Bloop found your bugs. You will not like the results.",
  "Analysis complete. Your model has issues. Bloop is not surprised.",
  "Bloop has seen worse. Not much worse, but worse."
];

async function runAudit() {
  const input = document.getElementById('input').value.trim();
  if (!input) return;
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status thinking';
  status.textContent = '⟳ Bloop is auditing your model...';
  try {
    const prompt = input.includes(',')
      ? `Here is the dataset:\n${input}\n\nRun your full audit pipeline.`
      : input;
    const reply = await callGroq(prompt);
    auditCount++;
    document.getElementById('output').style.display = 'block';
    document.getElementById('timestamp').textContent = new Date().toLocaleTimeString();
    document.getElementById('bloopQuote').textContent = bloopQuotes[Math.floor(Math.random() * bloopQuotes.length)];
    document.getElementById('auditContent').innerHTML = `<div class="raw-output">${reply}</div>`;
    document.getElementById('memoryIndicator').className = 'memory-indicator active';
    document.getElementById('memoryIndicator').textContent = `✓ Audit #${auditCount} saved to memory. Bloop remembers context.`;
    status.className = 'status';
    status.textContent = '✓ Audit complete.';
  } catch(err) {
    status.className = 'status error';
    status.textContent = '✗ Error: ' + err.message;
  }
  btn.disabled = false;
}

async function followUp() {
  const input = document.getElementById('followUpInput');
  const question = input.value.trim();
  if (!question) return;
  const status = document.getElementById('status');
  status.className = 'status thinking';
  status.textContent = '⟳ Bloop is thinking...';
  input.value = '';
  try {
    const reply = await callGroq(question);
    const content = document.getElementById('auditContent');
    content.innerHTML += `<div class="raw-output" style="border-top:1px solid #222;margin-top:10px"><span style="color:#555;font-size:11px">You: ${question}</span>\n\n${reply}</div>`;
    status.className = 'status';
    status.textContent = '✓ Done.';
  } catch(err) {
    status.className = 'status error';
    status.textContent = '✗ Error: ' + err.message;
  }
}
</script>
</body>
</html>
